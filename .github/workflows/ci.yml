name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  pr-policy:
    name: Conventional PR & Semantic Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Branch Name, PR Title & Semantic Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - << 'EOF'
          import os, re, subprocess, sys

          branch_re = re.compile(r"^(feat|fix|security|perf|refactor|test|docs|build|ci|chore|hotfix)/[a-z0-9._-]+$")
          commit_re = re.compile(r"^(feat|fix|security|perf|refactor|test|docs|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+$")

          head_ref = os.environ["HEAD_REF"]
          pr_title = os.environ["PR_TITLE"]
          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]

          if not branch_re.match(head_ref):
              print(f"ERROR: Branch '{head_ref}' must match '<type>/<kebab-slug>'", file=sys.stderr)
              sys.exit(1)

          if not commit_re.match(pr_title):
              print(f"ERROR: PR title '{pr_title}' must follow Conventional Commits '<type>(<scope>): <summary>'", file=sys.stderr)
              sys.exit(1)

          subjects = subprocess.check_output(
              ["git", "log", "--no-merges", "--format=%s", f"{base_sha}..{head_sha}"],
              text=True,
          ).splitlines()

          for subj in subjects:
              if not commit_re.match(subj):
                  print(f"ERROR: Non-semantic commit message: '{subj}'", file=sys.stderr)
                  sys.exit(1)

          print(f"Verified branch '{head_ref}', PR title, and {len(subjects)} semantic commit(s).")
          EOF

  lint:
    name: Lint, Typecheck & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Ruff Lint
        run: uv run --extra dev ruff check src tests

      - name: Run Ruff Format Check
        run: uv run --extra dev ruff format --check src tests

      - name: Run Mypy Typecheck
        run: uv run --extra dev mypy src

      - name: Run Bandit Security Scan
        run: uv run --extra dev bandit -r src -c pyproject.toml

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run Pytest Suite
        run: uv run --extra dev pytest

  build-and-push-docker:
    name: Build and Push Docker Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
