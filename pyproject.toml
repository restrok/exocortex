[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exocortex"
version = "0.2.1"
description = "Long-term neocortex and collective memory system for AI coding assistants via MCP."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.10,<2",
    "neo4j>=5.18,<6",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-frontmatter>=1.1,<2",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7,<2",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0",
]

[project.scripts]
exocortex = "exocortex.cli:main"
brainctl = "exocortex.cli:main"
exocortexctl = "exocortex.cli:main"
exocortex-mcp = "exocortex.mcp_server:main"
brain-mcp = "exocortex.mcp_server:main"
exocortex-scheduler = "exocortex.scheduler:main"
brain-scheduler = "exocortex.scheduler:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning",
    "error::ResourceWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
