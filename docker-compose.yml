x-brain-environment: &brain-environment
  BRAIN_DATA_DIR: /data/brain
  BRAIN_DEFAULT_SPACE: "${BRAIN_DEFAULT_SPACE:-work}"
  BRAIN_LLM_BASE_URL: "${BRAIN_LLM_BASE_URL:?Set BRAIN_LLM_BASE_URL}"
  BRAIN_LLM_MODEL: "${BRAIN_LLM_MODEL:-gpt-5.6-luna}"
  BRAIN_REFLECTION_MODEL: "${BRAIN_REFLECTION_MODEL:-gpt-5.6-luna}"
  BRAIN_REFLECTION_REASONING_EFFORT: "${BRAIN_REFLECTION_REASONING_EFFORT:-high}"
  BRAIN_EMBEDDING_MODEL: "${BRAIN_EMBEDDING_MODEL:-text-embedding-3-large}"
  BRAIN_LLM_RESPONSE_FORMAT: "${BRAIN_LLM_RESPONSE_FORMAT:-text}"
  BRAIN_SEARCH_EMBEDDING_TIMEOUT_SECONDS: "${BRAIN_SEARCH_EMBEDDING_TIMEOUT_SECONDS:-10}"
  BRAIN_LLM_API_KEY: "${BRAIN_LLM_API_KEY:-}"
  BRAIN_LLM_TIMEOUT_SECONDS: "${BRAIN_LLM_TIMEOUT_SECONDS:-180}"
  BRAIN_GATEWAY_WALL_TIMEOUT_SECONDS: "${BRAIN_GATEWAY_WALL_TIMEOUT_SECONDS:-120}"
  BRAIN_CANARY_TIMEOUT_SECONDS: "${BRAIN_CANARY_TIMEOUT_SECONDS:-30}"
  BRAIN_GATEWAY_RETRY_ATTEMPTS: "${BRAIN_GATEWAY_RETRY_ATTEMPTS:-1}"
  BRAIN_GATEWAY_RETRY_BACKOFF_SECONDS: "${BRAIN_GATEWAY_RETRY_BACKOFF_SECONDS:-0.25}"
  BRAIN_EXTRACTION_MAX_CHARS: "${BRAIN_EXTRACTION_MAX_CHARS:-16000}"
  BRAIN_CODEX_SESSIONS_DIR: /sources/codex
  BRAIN_SESSION_CLOSED_AFTER_SECONDS: "${BRAIN_SESSION_CLOSED_AFTER_SECONDS:-1800}"
  BRAIN_INGEST_MAX_LLM_CALLS: "${BRAIN_INGEST_MAX_LLM_CALLS:-50}"
  BRAIN_INGEST_MAX_SECONDS: "${BRAIN_INGEST_MAX_SECONDS:-1800}"
  BRAIN_INGEST_BATCH_SIZE: "${BRAIN_INGEST_BATCH_SIZE:-5}"
  BRAIN_EMBEDDING_BATCH_SIZE: "${BRAIN_EMBEDDING_BATCH_SIZE:-50}"
  BRAIN_NEO4J_UPSERT_BATCH_SIZE: "${BRAIN_NEO4J_UPSERT_BATCH_SIZE:-100}"
  BRAIN_SCHEDULER_BACKFILL_ENABLED: "${BRAIN_SCHEDULER_BACKFILL_ENABLED:-false}"
  BRAIN_SCHEDULER_FALLBACK_RETRY_ENABLED: "${BRAIN_SCHEDULER_FALLBACK_RETRY_ENABLED:-true}"
  BRAIN_REFLECTION_HOUR: "${BRAIN_REFLECTION_HOUR:-3}"
  BRAIN_TIMEZONE: "${BRAIN_TIMEZONE:-America/Argentina/Buenos_Aires}"
  BRAIN_REFLECTION_MAX_NOTES: "${BRAIN_REFLECTION_MAX_NOTES:-50}"
  BRAIN_REFLECTION_SEMANTIC_ENABLED: "${BRAIN_REFLECTION_SEMANTIC_ENABLED:-true}"
  BRAIN_OPERATIONAL_CONTEXT_ENABLED: "${BRAIN_OPERATIONAL_CONTEXT_ENABLED:-false}"
  BRAIN_OPERATIONAL_ROLE: "${BRAIN_OPERATIONAL_ROLE:-}"
  BRAIN_OPERATIONAL_DOMAINS: "${BRAIN_OPERATIONAL_DOMAINS:-}"
  BRAIN_OPERATIONAL_COMMON_TASKS: "${BRAIN_OPERATIONAL_COMMON_TASKS:-}"
  BRAIN_OPERATIONAL_PREFERRED_TOOLS: "${BRAIN_OPERATIONAL_PREFERRED_TOOLS:-}"
  BRAIN_OPERATIONAL_LOW_PRIORITY: "${BRAIN_OPERATIONAL_LOW_PRIORITY:-}"
  BRAIN_OPERATIONAL_RISK_POLICY: "${BRAIN_OPERATIONAL_RISK_POLICY:-high_confidence_and_low_risk}"
  NEO4J_URI: bolt://192.168.89.31:7687
  NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}"
  BRAIN_MCP_HOST: 0.0.0.0
  BRAIN_MCP_PORT: 8765
  BRAIN_SYNC_INTERVAL_SECONDS: "${BRAIN_SYNC_INTERVAL_SECONDS:-86400}"
  BRAIN_OTEL_ENABLED: "${BRAIN_OTEL_ENABLED:-false}"
  BRAIN_OTEL_SERVICE_NAME: "${BRAIN_OTEL_SERVICE_NAME:-codex-brain}"
  BRAIN_OTEL_ENVIRONMENT: "${BRAIN_OTEL_ENVIRONMENT:-local}"
  BRAIN_OTEL_EXPORTER_ENDPOINT: "${BRAIN_OTEL_EXPORTER_ENDPOINT:-otel-collector:4317}"
  BRAIN_OTEL_EXPORTER_INSECURE: "${BRAIN_OTEL_EXPORTER_INSECURE:-true}"
  BRAIN_OTEL_METRIC_EXPORT_INTERVAL_MS: "${BRAIN_OTEL_METRIC_EXPORT_INTERVAL_MS:-10000}"
  BRAIN_OTEL_SPAN_EXPORT_DELAY_MS: "${BRAIN_OTEL_SPAN_EXPORT_DELAY_MS:-5000}"

services:
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}"
    volumes:
      - "${BRAIN_HOST_DATA_DIR:-./brain}/neo4j/data:/data"
      - "${BRAIN_HOST_DATA_DIR:-./brain}/neo4j/logs:/logs"
      - "${BRAIN_HOST_DATA_DIR:-./brain}/neo4j/import:/var/lib/neo4j/import"
      - "${BRAIN_HOST_DATA_DIR:-./brain}/neo4j/plugins:/plugins"
    networks:
      vlan100_net_dhcp:
        ipv4_address: 192.168.89.31
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  brain:
    image: exocortex:local
    networks:
      vlan100_net_dhcp:
        ipv4_address: 192.168.89.30
    command: ["brain-mcp"]
    environment: *brain-environment
    volumes:
      - "${BRAIN_HOST_DATA_DIR:-./brain}:/data/brain"
    depends_on:
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  scheduler:
    build:
      context: .
    networks:
      vlan100_net_dhcp:
    command: ["brain-scheduler"]
    environment: *brain-environment
    volumes:
      - "${BRAIN_HOST_DATA_DIR:-./brain}:/data/brain"
      - "${BRAIN_CODEX_SESSIONS_HOST_DIR:-${HOME}/.codex/sessions}:/sources/codex:ro"
    depends_on:
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  vlan100_net_dhcp:
    external: true